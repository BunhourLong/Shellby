[package]
name = "t03-pty"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rustix = { version = "=1.1.6", features = ["pty", "termios", "process", "event", "fs", "stdio"] }
portable-pty = "=0.9.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
libc = "=0.2.191"   # already transitive via all three candidates; sigprocmask + close_range (rustix 1.1.6 lacks both)

[profile.release]
debug = 1
