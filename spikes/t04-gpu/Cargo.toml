[package]
name = "t04-gpu"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["csd"]
# csd = winit default features (incl. wayland-csd-adwaita); build with --no-default-features for the csd-off row.
csd = ["winit/default"]

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
t04-fonts = { path = "../t04-fonts" }

[profile.release]
debug = 1
